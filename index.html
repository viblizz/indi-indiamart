<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indiamart Data Management</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        td { transition: background-color 0.15s ease; }
        
        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
            z-index: 10;
        }
        .resizer:hover, .resizer:active {
            background-color: rgba(0, 82, 204, 0.3);
        }
        
        .sticky-col {
            position: sticky;
            z-index: 10;
            background-color: inherit;
        }
        .sticky-col-header {
            z-index: 40 !important;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#0052cc',
                        brandBlueDark: '#0043a8',
                        brandOrange: '#f97316',
                        brandOrangeDark: '#ea580c'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 md:h-screen flex flex-col md:overflow-hidden min-h-screen">

    <header class="bg-white shadow-md border-b border-gray-200 relative z-20 flex-shrink-0">
        <div class="max-w-screen-2xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-brandOrange text-white p-2 rounded-lg">
                    <i class="ph-fill ph-globe-hemisphere-west text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-brandBlue tracking-tight">Indiamart</h1>
                    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Data Management</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center justify-center gap-2 w-full sm:w-auto">
                <button onclick="window.openReorderModal()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 rounded-lg font-medium transition-colors shadow-sm text-sm whitespace-nowrap">
                    <i class="ph ph-arrows-left-right"></i> Reorder Columns
                </button>
                <button onclick="window.openSupplierManager()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-white text-brandBlue hover:bg-blue-50 border border-brandBlue rounded-lg font-medium transition-colors shadow-sm text-sm whitespace-nowrap">
                    <i class="ph ph-users"></i> Manage Suppliers
                </button>
                <button onclick="window.exportToCSV()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-white text-brandOrange hover:bg-orange-50 border border-brandOrange rounded-lg font-medium transition-colors shadow-sm text-sm whitespace-nowrap">
                    <i class="ph ph-file-csv"></i> Export Data
                </button>
                <button onclick="window.openProductModal()" class="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-2 bg-brandBlue text-white hover:bg-brandBlueDark rounded-lg font-medium transition-colors shadow-md text-sm whitespace-nowrap">
                    <i class="ph ph-plus-circle text-lg"></i> Add Product
                </button>
            </div>
        </div>
    </header>

    <main class="md:flex-grow md:overflow-auto max-w-screen-2xl mx-auto px-4 py-6 w-full flex flex-col gap-5 relative z-10 no-scrollbar">
        
        <div class="flex-shrink-0 flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-3 rounded-xl shadow-sm border border-gray-200">
            <div class="relative w-full md:w-1/2">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="text" id="searchInput" placeholder="Search by multiple keywords (e.g., '50 cob')..." 
                       class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brandOrange focus:border-brandOrange outline-none transition-shadow text-sm"
                       oninput="window.handleSearch()">
            </div>
            <div class="text-sm text-brandBlue font-semibold px-2 bg-blue-50 py-1.5 rounded-lg border border-blue-100" id="syncStatus">
                <i class="ph ph-arrows-clockwise animate-spin inline-block mr-1"></i> Syncing with Firebase...
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex-grow flex flex-col min-h-[500px]">
            <div class="overflow-auto w-full md:h-full h-[75vh] no-scrollbar relative" id="tableContainer">
                <table class="min-w-full divide-y divide-gray-200 text-sm table-fixed" id="mainTable">
                    <thead class="bg-gray-100 sticky top-0 z-[35] shadow-md border-b border-gray-300">
                        <tr id="tableHeaderRow">
                            <!-- Injected by JS -->
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-100" id="tableBody">
                        <!-- Injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Supplier Reorder Modal -->
    <div id="reorderModal" class="fixed inset-0 z-[60] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" onclick="window.closeReorderModal()"></div>
            <div class="relative bg-white rounded-xl text-left shadow-2xl transform transition-all sm:my-8 sm:max-w-md w-full flex flex-col">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-xl">
                    <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                        <i class="ph-fill ph-arrows-left-right text-brandBlue text-xl"></i> Reorder Party Columns
                    </h3>
                    <button onclick="window.closeReorderModal()" class="text-gray-400 hover:text-gray-800">
                        <i class="ph ph-x text-xl"></i>
                    </button>
                </div>
                <div class="p-6 bg-white max-h-[60vh] overflow-y-auto">
                    <p class="text-xs text-gray-500 mb-4">Use the arrows to change the order of the suppliers in the table.</p>
                    <div id="reorderListContainer" class="space-y-2">
                        <!-- Injected by JS -->
                    </div>
                </div>
                <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3 rounded-b-xl border-t border-gray-200">
                    <button type="button" onclick="window.closeReorderModal()" class="px-5 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-100">Cancel</button>
                    <button type="button" onclick="window.saveReorder()" class="px-5 py-2 bg-brandBlue text-white text-sm font-bold rounded-lg hover:bg-brandBlueDark shadow-md">Apply Order</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="fixed inset-0 z-[70] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm" onclick="window.closeLightbox()">
        <button class="absolute top-4 right-4 text-white hover:text-gray-300 text-3xl"><i class="ph ph-x"></i></button>
        <img id="lightboxImg" src="" class="max-w-[90%] max-h-[90vh] object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()">
    </div>

    <!-- Manage Suppliers Modal -->
    <div id="supplierModal" class="fixed inset-0 z-[60] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" onclick="window.closeSupplierManager()"></div>
            <div class="relative bg-white rounded-xl text-left shadow-2xl transform transition-all sm:my-8 sm:max-w-4xl w-full flex flex-col max-h-[90vh]">
                
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-xl">
                    <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                        <i class="ph-fill ph-users-three text-brandOrange text-xl"></i> Manage Suppliers
                    </h3>
                    <button onclick="window.closeSupplierManager()" class="text-gray-400 hover:text-gray-800">
                        <i class="ph ph-x text-xl"></i>
                    </button>
                </div>

                <div class="p-6 bg-white overflow-y-auto flex flex-col md:flex-row gap-6 flex-grow">
                    <!-- Form -->
                    <div class="w-full md:w-1/3 bg-orange-50/50 border border-orange-100 rounded-xl p-5 h-fit">
                        <h4 id="supFormTitle" class="text-sm font-bold text-brandOrange mb-4">Add New Supplier</h4>
                        <div class="space-y-3">
                            <input type="hidden" id="supId">
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Company Name *</label>
                                <input type="text" id="supCompany" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Supplier Name *</label>
                                <input type="text" id="supName" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Nick Name (Table Header)</label>
                                <input type="text" id="supNick" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Contact Number</label>
                                <input type="text" id="supContact" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Address</label>
                                <textarea id="supAddress" rows="2" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none"></textarea>
                            </div>
                            <button type="button" onclick="window.saveSupplier()" class="w-full bg-brandOrange text-white rounded py-2 text-sm font-semibold hover:bg-brandOrangeDark transition mt-2">
                                Save Supplier
                            </button>
                            <button type="button" onclick="window.resetSupplierForm()" class="w-full bg-white border border-gray-300 text-gray-700 rounded py-1.5 text-xs font-medium hover:bg-gray-50 transition mt-1">
                                Clear Form
                            </button>
                        </div>
                    </div>

                    <!-- List -->
                    <div class="w-full md:w-2/3 flex flex-col">
                        <h4 class="text-sm font-bold text-gray-800 mb-3 border-b pb-2">Saved Suppliers</h4>
                        <div id="supplierListContainer" class="space-y-2 overflow-y-auto pr-2 pb-4 h-full max-h-[400px]">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="fixed inset-0 z-[60] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" onclick="window.closeProductModal()"></div>
            <div class="relative bg-white rounded-xl text-left shadow-2xl transform transition-all sm:my-8 sm:max-w-2xl w-full flex flex-col">
                
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-xl">
                    <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2" id="prodModalTitle">
                        <i class="ph-fill ph-package text-brandBlue text-xl"></i> Add Product
                    </h3>
                    <button type="button" onclick="window.closeProductModal()" class="text-gray-400 hover:text-gray-800">
                        <i class="ph ph-x text-xl"></i>
                    </button>
                </div>
                    
                <div class="p-6 bg-white space-y-5">
                    <input type="hidden" id="editingProductId" value="">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Product Name *</label>
                            <input type="text" id="prodName" class="w-full border border-gray-300 rounded-lg py-2 px-3 text-sm focus:ring-2 focus:ring-brandBlue outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Carton Size *</label>
                            <input type="text" id="prodSize" placeholder="e.g. 24 Pcs/Crtn" class="w-full border border-gray-300 rounded-lg py-2 px-3 text-sm focus:ring-2 focus:ring-brandBlue outline-none">
                        </div>
                    </div>

                    <div class="border-t border-gray-100 pt-4">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Product Images (Up to 5)</label>
                        <p class="text-xs text-brandOrange mb-3 font-medium">Images are automatically compressed before saving.</p>
                        
                        <div class="grid grid-cols-5 gap-2 sm:gap-4" id="imageUploadContainer">
                            <!-- Inputs generated by JS -->
                        </div>
                        <div id="existingImagesContainer" class="hidden"></div>
                    </div>
                </div>
                
                <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3 rounded-b-xl border-t border-gray-200">
                    <button type="button" onclick="window.closeProductModal()" class="px-5 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-100">
                        Cancel
                    </button>
                    <button type="button" onclick="window.saveProduct()" class="px-5 py-2 bg-brandBlue text-white text-sm font-bold rounded-lg hover:bg-brandBlueDark shadow-md">
                        Save Product
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="customAlert" class="fixed inset-0 z-[100] hidden overflow-y-auto flex items-center justify-center">
        <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity"></div>
        <div class="bg-white rounded-xl shadow-xl transform transition-all w-full max-w-sm mx-4 relative z-10 overflow-hidden">
            <div class="p-6 text-center">
                <div id="alertIcon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4"></div>
                <h3 class="text-lg font-bold text-gray-900 mb-2" id="alertTitle">Alert</h3>
                <p class="text-sm text-gray-500" id="alertMessage"></p>
            </div>
            <div class="bg-gray-50 px-4 py-3 flex justify-center gap-3 border-t border-gray-100" id="alertActions">
                <!-- Buttons Injected -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJyENlXcr0LG8hKwbAkG3y8eRe0TXP4E",
            authDomain: "indiglob-indiamart.firebaseapp.com",
            databaseURL: "https://indiglob-indiamart-default-rtdb.firebaseio.com",
            projectId: "indiglob-indiamart",
            storageBucket: "indiglob-indiamart.firebasestorage.app",
            messagingSenderId: "270808193556",
            appId: "1:270808193556:web:d71c120e36ecbaa3582501"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.products = [];
        window.suppliers = [];
        window.filteredProducts = [];
        window.currentConfirmAction = null;

        window.loadData = async function() {
            const status = document.getElementById('syncStatus');
            try {
                const snapshot = await get(child(ref(db), `indiglobData`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    window.products = data.products || [];
                    window.suppliers = data.suppliers || [];
                } else {
                    window.products = [];
                    window.suppliers = [];
                }
                window.products.reverse(); 
                window.filteredProducts = [...window.products];
                window.renderTable();
                
                status.innerHTML = `<i class="ph-fill ph-check-circle text-green-500 inline-block mr-1"></i> Data synced`;
                status.className = "text-sm text-green-700 font-semibold px-2 bg-green-50 py-1.5 rounded-lg border border-green-100";
            } catch (error) {
                console.error("DB Error:", error);
                status.innerHTML = `<i class="ph-fill ph-warning-circle text-red-500 inline-block mr-1"></i> Sync failed`;
                window.showAlert("Error", "Could not connect to Firebase database.", "error");
            }
        };

        window.saveData = function() {
            const status = document.getElementById('syncStatus');
            status.innerHTML = `<i class="ph ph-spinner animate-spin inline-block mr-1"></i> Saving...`;
            const dataToSave = [...window.products].reverse();
            
            set(ref(db, 'indiglobData'), {
                products: dataToSave,
                suppliers: window.suppliers
            }).then(() => {
                status.innerHTML = `<i class="ph-fill ph-check-circle text-green-500 inline-block mr-1"></i> Saved successfully`;
                setTimeout(() => {
                    status.innerHTML = `<i class="ph-fill ph-cloud-check text-brandBlue inline-block mr-1"></i> Cloud Synced`;
                }, 2000);
            }).catch(error => {
                window.showAlert("Error", "Failed to save data. Check connection.", "error");
            });
        };

        window.showAlert = function(title, message, type = 'info', callback = null) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const icon = document.getElementById('alertIcon');
            const actions = document.getElementById('alertActions');

            if (type === 'error') {
                icon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-red-100 text-red-600 text-2xl';
                icon.innerHTML = '<i class="ph-fill ph-warning"></i>';
                actions.innerHTML = `<button onclick="window.closeAlert()" class="px-5 py-2 bg-red-600 text-white rounded-lg font-bold">Close</button>`;
            } else if (type === 'confirm') {
                icon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-orange-100 text-brandOrange text-2xl';
                icon.innerHTML = '<i class="ph-fill ph-question"></i>';
                window.currentConfirmAction = callback;
                actions.innerHTML = `
                    <button onclick="window.closeAlert()" class="px-5 py-2 border border-gray-300 text-gray-700 bg-white rounded-lg font-medium">Cancel</button>
                    <button onclick="window.executeConfirm()" class="px-5 py-2 bg-brandOrange text-white rounded-lg font-bold">Confirm</button>
                `;
            } else {
                icon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-blue-100 text-brandBlue text-2xl';
                icon.innerHTML = '<i class="ph-fill ph-info"></i>';
                actions.innerHTML = `<button onclick="window.closeAlert()" class="px-5 py-2 bg-brandBlue text-white rounded-lg font-bold">OK</button>`;
            }
            document.getElementById('customAlert').classList.remove('hidden');
        };

        window.closeAlert = function() {
            document.getElementById('customAlert').classList.add('hidden');
            window.currentConfirmAction = null;
        };

        window.executeConfirm = function() {
            if (typeof window.currentConfirmAction === 'function') window.currentConfirmAction();
            window.closeAlert();
        };

        let isResizing = false;
        let currentTh = null;
        let startX = 0;
        let startWidth = 0;

        window.initResize = function(e, th) {
            isResizing = true;
            currentTh = th;
            startX = e.pageX || (e.touches && e.touches[0].pageX);
            startWidth = currentTh.offsetWidth;
            
            document.addEventListener('mousemove', window.doResize);
            document.addEventListener('mouseup', window.stopResize);
            document.addEventListener('touchmove', window.doResize, {passive: false});
            document.addEventListener('touchend', window.stopResize);
            e.stopPropagation();
        };

        window.doResize = function(e) {
            if (!isResizing) return;
            const currentX = e.pageX || (e.touches && e.touches[0].pageX);
            const diff = currentX - startX;
            currentTh.style.width = (startWidth + diff) + 'px';
            currentTh.style.minWidth = (startWidth + diff) + 'px';
            window.updateStickyPositions();
        };

        window.stopResize = function() {
            isResizing = false;
            document.removeEventListener('mousemove', window.doResize);
            document.removeEventListener('mouseup', window.stopResize);
            document.removeEventListener('touchmove', window.doResize);
            document.removeEventListener('touchend', window.stopResize);
        };

        window.updateStickyPositions = function() {
            const isDesktop = window.innerWidth >= 768;
            const table = document.getElementById('mainTable');
            if(!table) return;

            const rows = table.querySelectorAll('tr');
            rows.forEach((row, rowIndex) => {
                const cells = row.children;
                if(cells.length >= 3) {
                    if (isDesktop) {
                        let leftPos = 0;
                        for(let i=0; i<3; i++) {
                            cells[i].classList.add('sticky-col');
                            if(rowIndex === 0) cells[i].classList.add('sticky-col-header');
                            cells[i].style.left = leftPos + 'px';
                            leftPos += cells[i].offsetWidth;
                            cells[i].classList.add(rowIndex === 0 ? 'bg-gray-100' : 'bg-white');
                        }
                    } else {
                        for(let i=0; i<3; i++) {
                            cells[i].classList.remove('sticky-col', 'sticky-col-header');
                            cells[i].style.left = 'auto';
                        }
                    }
                }
            });
        };

        window.addEventListener('resize', () => {
            requestAnimationFrame(window.updateStickyPositions);
        });

        window.openLightbox = function(imgSrc) {
            if(imgSrc.includes('No+Img')) return; 
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightboxModal').classList.remove('hidden');
        };
        window.closeLightbox = function() {
            document.getElementById('lightboxModal').classList.add('hidden');
            document.getElementById('lightboxImg').src = '';
        };

        window.renderTable = function() {
            const thead = document.getElementById('tableHeaderRow');
            const tbody = document.getElementById('tableBody');
            
            let hHTML = `
                <th class="relative px-4 py-3 text-left font-bold text-gray-600 bg-gray-100 border-b-2 border-r border-gray-200" style="width: 80px; min-width: 80px;">
                    Image <div class="resizer" onmousedown="window.initResize(event, this.parentElement)" ontouchstart="window.initResize(event, this.parentElement)"></div>
                </th>
                <th class="relative px-4 py-3 text-left font-bold text-gray-600 bg-gray-100 border-b-2 border-r border-gray-200" style="width: 250px; min-width: 250px;">
                    Product Detail <div class="resizer" onmousedown="window.initResize(event, this.parentElement)" ontouchstart="window.initResize(event, this.parentElement)"></div>
                </th>
                <th class="relative px-4 py-3 text-left font-bold text-gray-600 bg-gray-100 border-b-2 border-r border-gray-200" style="width: 120px; min-width: 120px;">
                    Crtn Size <div class="resizer" onmousedown="window.initResize(event, this.parentElement)" ontouchstart="window.initResize(event, this.parentElement)"></div>
                </th>
            `;
            
            window.suppliers.forEach(sup => {
                const display = sup.nickName || sup.companyName;
                hHTML += `
                    <th class="relative px-4 py-2 text-left border-r border-gray-200 bg-blue-50 border-b-2 border-brandBlue/30" style="width: 140px; min-width: 140px;">
                        <div class="text-sm font-bold text-brandBlue truncate" title="${sup.companyName}">${window.escapeHtml(display)}</div>
                        <div class="text-[10px] font-bold text-gray-500 uppercase">Rate (₹)</div>
                        <div class="resizer" onmousedown="window.initResize(event, this.parentElement)" ontouchstart="window.initResize(event, this.parentElement)"></div>
                    </th>`;
            });
            hHTML += `<th class="px-4 py-3 text-center font-bold text-gray-600 bg-gray-100 border-b-2 border-gray-200" style="width: 80px;">Action</th>`;
            thead.innerHTML = hHTML;

            if (window.filteredProducts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${4 + window.suppliers.length}" class="py-20 text-center text-gray-400 font-medium bg-white">No products match your search.</td></tr>`;
                requestAnimationFrame(window.updateStickyPositions);
                return;
            }

            let bHTML = '';
            window.filteredProducts.forEach(prod => {
                const img = (prod.images && prod.images.length > 0) ? prod.images[0] : 'https://placehold.co/100x100/f8fafc/94a3b8?text=No+Img';
                
                bHTML += `
                    <tr class="hover:bg-orange-50/30 group border-b border-gray-100 transition-colors">
                        <td class="px-4 py-3 border-r border-gray-100 bg-white">
                            <img src="${img}" class="h-12 w-12 rounded object-cover border border-gray-200 cursor-pointer bg-white shadow-sm hover:ring-2 ring-brandBlue" onclick="window.openLightbox('${img}')">
                        </td>
                        <td class="px-4 py-3 border-r border-gray-100 bg-white">
                            <div class="font-bold text-brandBlue cursor-pointer hover:text-brandOrange transition-colors text-[15px] truncate" onclick="window.editProduct('${prod.id}')">${window.escapeHtml(prod.name)}</div>
                            <div class="text-[11px] text-gray-500 font-medium mt-0.5">${prod.images?.length || 0}/5 images</div>
                        </td>
                        <td class="px-4 py-3 border-r border-gray-100 bg-white group/crtn cursor-pointer hover:bg-blue-50/50" onclick="window.startCrtnEdit(event, '${prod.id}', '${window.escapeHtml(prod.crtnSize)}')">
                            <div class="font-semibold text-gray-700 min-h-[24px] flex items-center" id="crtn-${prod.id}">${window.escapeHtml(prod.crtnSize) || '<span class="text-gray-300 text-xs italic">Set size</span>'}</div>
                        </td>
                `;

                window.suppliers.forEach(sup => {
                    const rData = prod.supplierRates ? prod.supplierRates[sup.id] : null;
                    const rVal = rData && rData.rate ? rData.rate : '';
                    const rDate = rData && rData.date ? rData.date : '';
                    
                    bHTML += `
                        <td class="px-4 py-2 border-r border-gray-100 relative group/cell cursor-pointer hover:bg-blue-50/50" 
                            onclick="window.startInlineEdit(event, '${prod.id}', '${sup.id}', '${rVal}')">
                            <div class="flex flex-col min-h-[36px] justify-center" id="cell-${prod.id}-${sup.id}">
                                ${rVal ? `<div class="font-bold text-gray-900 text-[15px]">₹ ${parseFloat(rVal).toLocaleString('en-IN')}</div>
                                          <div class="text-[9px] text-brandOrange font-semibold uppercase mt-0.5">${rDate}</div>` 
                                       : `<span class="text-gray-300 text-xs italic font-medium">Set price</span>`}
                            </div>
                        </td>`;
                });

                bHTML += `
                        <td class="px-4 py-3 text-center bg-white">
                            <button onclick="window.deleteProduct('${prod.id}')" class="text-gray-400 hover:text-red-500 transition-colors">
                                <i class="ph-fill ph-trash text-xl"></i>
                            </button>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = bHTML;
            
            requestAnimationFrame(window.updateStickyPositions);
        };

        window.handleSearch = function() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const terms = val.split(' ').filter(t => t.trim() !== '');
            
            window.filteredProducts = window.products.filter(p => {
                const name = p.name.toLowerCase();
                return terms.every(term => name.includes(term));
            });
            window.renderTable();
        };

        window.startCrtnEdit = function(e, prodId, currentVal) {
            const container = document.getElementById(`crtn-${prodId}`);
            if(container.querySelector('input')) return;
            
            container.innerHTML = `
                <input type="text" value="${currentVal}" 
                       class="w-full px-1 py-0.5 text-sm border-2 border-brandBlue rounded outline-none font-bold text-gray-900 bg-white"
                       onblur="window.saveCrtnEdit(this, '${prodId}')"
                       onkeydown="if(event.key==='Enter') this.blur(); if(event.key==='Escape') window.renderTable();">
            `;
            const input = container.querySelector('input');
            input.focus();
            input.select();
            e.stopPropagation();
        };

        // NEW FEATURE: Move to top when Carton Size is edited
        window.saveCrtnEdit = function(inputEl, prodId) {
            const val = inputEl.value.trim();
            const pIdx = window.products.findIndex(p => p.id === prodId);
            if (pIdx > -1) {
                if (window.products[pIdx].crtnSize !== val) {
                    window.products[pIdx].crtnSize = val;
                    // Splice and unshift to move to top
                    const movedProd = window.products.splice(pIdx, 1)[0];
                    window.products.unshift(movedProd);
                    window.saveData();
                }
            }
            window.handleSearch();
        };

        window.startInlineEdit = function(e, prodId, supId, currentVal) {
            const contentDiv = document.getElementById(`cell-${prodId}-${supId}`);
            if(contentDiv.querySelector('input')) return;
            
            contentDiv.innerHTML = `
                <div class="flex items-center gap-1">
                    <span class="text-brandBlue font-bold">₹</span>
                    <input type="number" step="0.01" value="${currentVal}" 
                           class="w-[80px] px-1 py-0.5 text-sm border-2 border-brandBlue rounded outline-none font-bold text-gray-900 bg-white"
                           onblur="window.saveInlineEdit(this, '${prodId}', '${supId}')"
                           onkeydown="if(event.key==='Enter') this.blur(); if(event.key==='Escape') window.renderTable();">
                </div>
            `;
            const input = contentDiv.querySelector('input');
            input.focus();
            input.select();
            e.stopPropagation();
        };

        // NEW FEATURE: Move to top when Price is edited
        window.saveInlineEdit = function(inputEl, prodId, supId) {
            const val = inputEl.value.trim();
            const pIdx = window.products.findIndex(p => p.id === prodId);
            
            if (pIdx > -1) {
                if (!window.products[pIdx].supplierRates) window.products[pIdx].supplierRates = {};
                
                let isChanged = false;
                
                if (val !== '' && parseFloat(val) >= 0) {
                    const parsedVal = parseFloat(val).toString();
                    if (!window.products[pIdx].supplierRates[supId] || window.products[pIdx].supplierRates[supId].rate !== parsedVal) {
                        const d = new Date();
                        const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear().toString().slice(-2)}`;
                        window.products[pIdx].supplierRates[supId] = { rate: parsedVal, date: dateStr };
                        isChanged = true;
                    }
                } else {
                    if (window.products[pIdx].supplierRates[supId]) {
                        delete window.products[pIdx].supplierRates[supId];
                        isChanged = true;
                    }
                }
                
                if (isChanged) {
                    // Splice and unshift to move to top
                    const movedProd = window.products.splice(pIdx, 1)[0];
                    window.products.unshift(movedProd);
                    window.saveData();
                }
            }
            window.handleSearch();
        };

        window.openReorderModal = function() {
            window.renderReorderList();
            document.getElementById('reorderModal').classList.remove('hidden');
        };

        window.closeReorderModal = function() {
            document.getElementById('reorderModal').classList.add('hidden');
        };

        window.renderReorderList = function() {
            const c = document.getElementById('reorderListContainer');
            if (window.suppliers.length === 0) {
                c.innerHTML = '<div class="text-sm text-gray-400 italic text-center py-4">No suppliers to reorder.</div>';
                return;
            }
            let html = '';
            window.suppliers.forEach((s, index) => {
                html += `
                    <div class="flex justify-between items-center bg-white border border-gray-200 p-3 rounded-lg shadow-sm">
                        <span class="font-bold text-gray-800 text-sm">${window.escapeHtml(s.companyName)} <span class="text-xs font-normal text-gray-500">(${s.nickName || s.name})</span></span>
                        <div class="flex gap-1">
                            <button onclick="window.moveSupplier(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="p-1.5 ${index === 0 ? 'text-gray-300' : 'text-brandBlue hover:bg-blue-50'} rounded"><i class="ph-fill ph-caret-up text-lg"></i></button>
                            <button onclick="window.moveSupplier(${index}, 1)" ${index === window.suppliers.length - 1 ? 'disabled' : ''} class="p-1.5 ${index === window.suppliers.length - 1 ? 'text-gray-300' : 'text-brandBlue hover:bg-blue-50'} rounded"><i class="ph-fill ph-caret-down text-lg"></i></button>
                        </div>
                    </div>
                `;
            });
            c.innerHTML = html;
        };

        window.moveSupplier = function(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= window.suppliers.length) return;
            const temp = window.suppliers[index];
            window.suppliers[index] = window.suppliers[newIndex];
            window.suppliers[newIndex] = temp;
            window.renderReorderList();
        };

        window.saveReorder = function() {
            window.saveData();
            window.renderTable();
            window.closeReorderModal();
        };

        window.openProductModal = function() {
            document.getElementById('editingProductId').value = '';
            document.getElementById('prodName').value = '';
            document.getElementById('prodSize').value = '';
            document.getElementById('prodModalTitle').innerHTML = '<i class="ph-fill ph-package text-brandBlue text-xl"></i> Add Product';
            window.buildImageInputs([]);
            document.getElementById('productModal').classList.remove('hidden');
        };

        window.closeProductModal = function() {
            document.getElementById('productModal').classList.add('hidden');
        };

        // NEW FEATURE: Move to top when Product details or images are edited
        window.saveProduct = function() {
            const name = document.getElementById('prodName').value.trim();
            const size = document.getElementById('prodSize').value.trim();
            const editId = document.getElementById('editingProductId').value;
            
            if (!name || !size) {
                window.showAlert("Required Fields", "Please enter both Product Name and Carton Size.", "info");
                return;
            }

            const images = [];
            for (let i = 1; i <= 5; i++) {
                const imgInput = document.getElementById(`prodImg${i}`);
                const hiddenInput = document.getElementById(`storedImg${i}`);
                if (imgInput && imgInput.dataset.base64) {
                    images.push(imgInput.dataset.base64);
                } else if (hiddenInput && hiddenInput.value) {
                    images.push(hiddenInput.value);
                }
            }

            if (editId) {
                const idx = window.products.findIndex(p => p.id === editId);
                if (idx > -1) {
                    window.products[idx].name = name;
                    window.products[idx].crtnSize = size;
                    window.products[idx].images = images;
                    
                    // Splice and unshift to move to top
                    const movedProd = window.products.splice(idx, 1)[0];
                    window.products.unshift(movedProd);
                }
            } else {
                window.products.unshift({
                    id: 'prod_' + Date.now(),
                    name: name,
                    crtnSize: size,
                    images: images,
                    supplierRates: {}
                });
            }

            window.handleSearch();
            window.saveData();
            window.closeProductModal();
        };

        window.editProduct = function(id) {
            const p = window.products.find(x => x.id === id);
            if(!p) return;
            document.getElementById('editingProductId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodSize').value = p.crtnSize;
            document.getElementById('prodModalTitle').innerHTML = '<i class="ph-fill ph-pencil-simple text-brandOrange text-xl"></i> Edit Product';
            window.buildImageInputs(p.images || []);
            document.getElementById('productModal').classList.remove('hidden');
        };

        window.deleteProduct = function(id) {
            window.showAlert("Delete Product", "Are you sure you want to delete this product forever?", "confirm", () => {
                window.products = window.products.filter(p => p.id !== id);
                window.handleSearch();
                window.saveData();
            });
        };

        window.previewImage = function(input, previewId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX = 600;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } 
                        else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                        
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        
                        const pDiv = document.getElementById(previewId);
                        pDiv.style.backgroundImage = `url(${dataUrl})`;
                        pDiv.classList.remove('hidden');
                        input.dataset.base64 = dataUrl;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.buildImageInputs = function(existing) {
            const c = document.getElementById('imageUploadContainer');
            const h = document.getElementById('existingImagesContainer');
            c.innerHTML = ''; h.innerHTML = '';
            
            existing.forEach((img, i) => {
                h.innerHTML += `<input type="hidden" id="storedImg${i+1}" value="${window.escapeHtml(img)}">`;
            });

            for (let i = 1; i <= 5; i++) {
                const imgData = existing[i-1] || '';
                const style = imgData ? `background-image: url(${imgData});` : '';
                const hideClass = imgData ? '' : 'hidden';
                
                c.innerHTML += `
                    <div class="relative group border-2 border-dashed border-gray-300 rounded-lg h-20 sm:h-24 flex flex-col items-center justify-center cursor-pointer hover:border-brandBlue overflow-hidden bg-gray-50">
                        <input type="file" id="prodImg${i}" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="window.previewImage(this, 'previewImg${i}')">
                        <div class="flex flex-col items-center z-10 pointer-events-none">
                            <i class="ph ph-image text-gray-400 text-xl group-hover:text-brandBlue"></i>
                            <span class="text-[10px] font-bold text-gray-400 group-hover:text-brandBlue mt-1">Img ${i}</span>
                        </div>
                        <div id="previewImg${i}" class="absolute inset-0 bg-cover bg-center bg-white z-[15] ${hideClass}" style="${style}">
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-bold z-10">Change</div>
                        </div>
                    </div>
                `;
            }
        };

        window.openSupplierManager = function() {
            window.resetSupplierForm();
            window.renderSupplierList();
            document.getElementById('supplierModal').classList.remove('hidden');
        };

        window.closeSupplierManager = function() {
            document.getElementById('supplierModal').classList.add('hidden');
        };

        window.resetSupplierForm = function() {
            document.getElementById('supId').value = '';
            document.getElementById('supName').value = '';
            document.getElementById('supCompany').value = '';
            document.getElementById('supNick').value = '';
            document.getElementById('supContact').value = '';
            document.getElementById('supAddress').value = '';
            document.getElementById('supFormTitle').innerText = 'Add New Supplier';
        };

        window.saveSupplier = function() {
            const id = document.getElementById('supId').value;
            const name = document.getElementById('supName').value.trim();
            const comp = document.getElementById('supCompany').value.trim();
            
            if (!name || !comp) {
                window.showAlert("Required", "Company Name and Supplier Name are mandatory.", "info");
                return;
            }

            const data = {
                id: id || 'sup_' + Date.now(),
                name: name,
                companyName: comp,
                nickName: document.getElementById('supNick').value.trim(),
                contact: document.getElementById('supContact').value.trim(),
                address: document.getElementById('supAddress').value.trim()
            };

            if (id) {
                const idx = window.suppliers.findIndex(s => s.id === id);
                if(idx > -1) window.suppliers[idx] = data;
            } else {
                window.suppliers.push(data);
            }

            window.saveData();
            window.resetSupplierForm();
            window.renderSupplierList();
            window.renderTable();
        };

        window.editSupplier = function(id) {
            const s = window.suppliers.find(x => x.id === id);
            if(!s) return;
            document.getElementById('supId').value = s.id;
            document.getElementById('supName').value = s.name;
            document.getElementById('supCompany').value = s.companyName;
            document.getElementById('supNick').value = s.nickName || '';
            document.getElementById('supContact').value = s.contact || '';
            document.getElementById('supAddress').value = s.address || '';
            document.getElementById('supFormTitle').innerText = 'Edit Supplier';
        };

        window.deleteSupplier = function(id) {
            window.showAlert("Delete Supplier", "Remove this supplier? Price columns will be deleted from all products.", "confirm", () => {
                window.suppliers = window.suppliers.filter(s => s.id !== id);
                window.products.forEach(p => {
                    if(p.supplierRates && p.supplierRates[id]) delete p.supplierRates[id];
                });
                window.saveData();
                window.renderSupplierList();
                window.renderTable();
            });
        };

        window.renderSupplierList = function() {
            const c = document.getElementById('supplierListContainer');
            if (window.suppliers.length === 0) {
                c.innerHTML = '<div class="text-sm text-gray-400 italic text-center py-4">No suppliers added yet.</div>';
                return;
            }
            let html = '';
            window.suppliers.forEach(s => {
                html += `
                    <div class="border border-gray-200 rounded-lg p-3 hover:border-brandOrange hover:bg-orange-50/20 transition-colors flex justify-between items-center group">
                        <div class="overflow-hidden">
                            <div class="font-bold text-gray-800 text-sm truncate">${window.escapeHtml(s.companyName)}</div>
                            <div class="text-xs text-gray-500 font-medium">${window.escapeHtml(s.name)} ${s.nickName ? `• <span class="text-brandBlue">${window.escapeHtml(s.nickName)}</span>` : ''}</div>
                        </div>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="window.editSupplier('${s.id}')" class="p-1.5 text-blue-500 hover:bg-blue-100 rounded"><i class="ph-fill ph-pencil-simple text-lg"></i></button>
                            <button onclick="window.deleteSupplier('${s.id}')" class="p-1.5 text-red-500 hover:bg-red-100 rounded"><i class="ph-fill ph-trash text-lg"></i></button>
                        </div>
                    </div>
                `;
            });
            c.innerHTML = html;
        };

        window.escapeHtml = function(s) {
            return (s || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        window.exportToCSV = function() {
            if(window.filteredProducts.length === 0) return;
            let csv = "Product Name,Carton Size,";
            window.suppliers.forEach(s => {
                csv += `"${(s.nickName || s.companyName).replace(/"/g, '""')} Rate",`;
                csv += `"${(s.nickName || s.companyName).replace(/"/g, '""')} Date Updated",`;
            });
            csv += "\r\n";
            
            window.filteredProducts.forEach(p => {
                csv += `"${p.name.replace(/"/g, '""')}","${p.crtnSize.replace(/"/g, '""')}",`;
                window.suppliers.forEach(s => {
                    const r = p.supplierRates ? p.supplierRates[s.id] : null;
                    csv += `"${r && r.rate ? r.rate : ''}","${r && r.date ? r.date : ''}",`;
                });
                csv += "\r\n";
            });

            const link = document.createElement("a");
            link.setAttribute("href", encodeURI("data:text/csv;charset=utf-8," + csv));
            link.setAttribute("download", `Indiamart_Export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.loadData();
    </script>
</body>
</html>
