<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indiamart Data Management</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        td { transition: background-color 0.15s ease; }

        /* Sticky Columns and Headers */
        .table-container {
        /* Custom Scrollbar for the table container */
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Base Column Widths */
        .sticky-col-1, .sticky-head-col-1 { width: var(--col1-width); min-width: var(--col1-width); max-width: var(--col1-width); }
        .sticky-col-2, .sticky-head-col-2 { width: var(--col2-width); min-width: var(--col2-width); max-width: var(--col2-width); }
        .sticky-col-3, .sticky-head-col-3 { width: var(--col3-width); min-width: var(--col3-width); max-width: var(--col3-width); }
        
        /* Regular Headers - Sticky Top (Applies on all screens) */
        .sticky-head-col-1, .sticky-head-col-2, .sticky-head-col-3, .sticky-head-other { position: sticky; top: 0; z-index: 35; }

        /* Sticky Columns - Horizontal Freeze (Only on md+ screens) */
        @media (min-width: 768px) {
            .sticky-col-1 { position: sticky; left: 0; z-index: 25; }
            .sticky-col-2 { position: sticky; left: var(--col1-width); z-index: 25; }
            .sticky-col-3 { position: sticky; left: calc(var(--col1-width) + var(--col2-width)); z-index: 25; }
            
            .sticky-head-col-1 { left: 0; z-index: 45; }
            .sticky-head-col-2 { left: var(--col1-width); z-index: 45; }
            .sticky-head-col-3 { left: calc(var(--col1-width) + var(--col2-width)); z-index: 45; }
            
            .sticky-shadow { box-shadow: 4px 0 6px -2px rgba(0,0,0,0.05); }
            .sticky-head-shadow { box-shadow: 4px 4px 6px -2px rgba(0,0,0,0.05); }
        }

        /* Column Resizer Handle */
        th { position: relative; }
        .resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 100%;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
            background-color: transparent;
            z-index: 50;
            transition: background-color 0.2s;
        }
        .resizer:hover, .resizer.active {
            background-color: #f97316; /* brandOrange indicator */
        }
    </style>

    <script>
        // Configure Tailwind theme colors
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#0052cc',
                        brandBlueDark: '#0043a8',
                        brandOrange: '#f97316',
                        brandOrangeDark: '#ea580c'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen md:h-screen md:overflow-hidden">

    <!-- Top Header: Normal flow on mobile, part of flex layout on desktop -->
    <header class="bg-white shadow-md border-b border-gray-200 relative z-20 flex-shrink-0">
        <div class="max-w-screen-2xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-brandOrange text-white p-2 rounded-lg shadow-sm">
                    <i class="ph-fill ph-globe-hemisphere-west text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-brandBlue tracking-tight">Indiamart</h1>
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Data Management</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center justify-center gap-2 w-full sm:w-auto">
                <button onclick="window.openSupplierManager()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-white text-brandBlue hover:bg-blue-50 border border-brandBlue/30 rounded-lg font-semibold transition-colors shadow-sm text-sm whitespace-nowrap">
                    <i class="ph ph-users text-lg"></i> Manage Suppliers
                </button>
                <button onclick="window.exportToCSV()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-white text-brandOrange hover:bg-orange-50 border border-brandOrange/30 rounded-lg font-semibold transition-colors shadow-sm text-sm whitespace-nowrap">
                    <i class="ph ph-file-csv text-lg"></i> Export Data
                </button>
                <button onclick="window.openProductModal()" class="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-2 bg-brandBlue text-white hover:bg-brandBlueDark rounded-lg font-bold transition-colors shadow-md text-sm whitespace-nowrap">
                    <i class="ph-bold ph-plus text-lg"></i> Add Product
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area: Handles scrolling only on desktop -->
    <main class="flex-grow max-w-screen-2xl mx-auto px-4 py-4 md:py-6 w-full flex flex-col gap-4 md:gap-5 relative z-10 no-scrollbar h-full md:overflow-hidden">
        
        <!-- Search Bar -->
        <div class="flex-shrink-0 flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-3 rounded-xl shadow-sm border border-gray-200">
            <div class="relative w-full md:w-1/2">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="text" id="searchInput" placeholder="Search products (e.g., '50 cob')..." 
                       class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-brandOrange focus:border-brandOrange outline-none transition-shadow text-sm bg-gray-50"
                       oninput="window.handleSearch()">
            </div>
            <div class="text-sm font-semibold px-3 py-1.5 rounded-lg border flex items-center gap-2 bg-blue-50 text-brandBlue border-blue-100" id="syncStatus">
                <i class="ph ph-arrows-clockwise animate-spin"></i> Syncing with Cloud...
            </div>
        </div>

        <!-- Table Container: h-[75vh] on mobile ensures it has its own scroll area, auto on desktop -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex-grow flex flex-col h-[75vh] md:h-auto md:min-h-0">
            <div class="overflow-auto w-full h-full no-scrollbar relative" id="tableContainer">
                <table class="min-w-full divide-y divide-gray-200 text-sm table-fixed" id="mainTable">
                    <!-- Thead made sticky with high z-index to stay above rows -->
                    <thead class="bg-gray-100 sticky top-0 z-[35] shadow-md border-b border-gray-300">
                        <tr id="tableHeaderRow">
                            <!-- Injected by JS -->
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 bg-white" id="tableBody">
                        <!-- Injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="imageLightbox" class="fixed inset-0 z-[200] hidden bg-black/90 flex items-center justify-center backdrop-blur-sm transition-opacity" onclick="window.closeLightbox()">
        <button class="absolute top-6 right-6 text-white/50 hover:text-white transition-colors" onclick="window.closeLightbox()">
            <i class="ph ph-x text-4xl"></i>
        </button>
        <img id="lightboxImg" src="" class="max-w-[90vw] max-h-[90vh] object-contain rounded-lg shadow-2xl border border-white/10" onclick="event.stopPropagation()">
    </div>

    <!-- Modals (Suppliers, Product, Alert) - Kept mostly same as previous -->
    <div id="supplierModal" class="fixed inset-0 z-[60] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" onclick="window.closeSupplierManager()"></div>
            <div class="relative bg-white rounded-xl text-left shadow-2xl transform transition-all sm:my-8 sm:max-w-4xl w-full flex flex-col max-h-[90vh]">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-xl">
                    <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                        <i class="ph-fill ph-users-three text-brandOrange text-xl"></i> Manage Suppliers
                    </h3>
                    <button onclick="window.closeSupplierManager()" class="text-gray-400 hover:text-gray-800"><i class="ph ph-x text-xl"></i></button>
                </div>
                <div class="p-6 bg-white overflow-y-auto flex flex-col md:flex-row gap-6 flex-grow">
                    <!-- Form -->
                    <div class="w-full md:w-1/3 bg-orange-50/50 border border-orange-100 rounded-xl p-5 h-fit">
                        <h4 id="supFormTitle" class="text-sm font-bold text-brandOrange mb-4">Add New Supplier</h4>
                        <div class="space-y-3">
                            <input type="hidden" id="supId">
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Company Name *</label>
                                <input type="text" id="supCompany" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Supplier Name *</label>
                                <input type="text" id="supName" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Nick Name (Table Header)</label>
                                <input type="text" id="supNick" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Contact Number</label>
                                <input type="text" id="supContact" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-600">Address</label>
                                <textarea id="supAddress" rows="2" class="w-full border border-gray-300 rounded py-1.5 px-3 text-sm focus:ring-1 focus:ring-brandOrange outline-none"></textarea>
                            </div>
                            <button type="button" onclick="window.saveSupplier()" class="w-full bg-brandOrange text-white rounded py-2 text-sm font-bold hover:bg-brandOrangeDark transition shadow-sm">Save Supplier</button>
                            <button type="button" onclick="window.resetSupplierForm()" class="w-full bg-white border border-gray-300 text-gray-700 rounded py-1.5 text-xs font-semibold hover:bg-gray-50 transition">Clear Form</button>
                        </div>
                    </div>
                    <!-- List -->
                    <div class="w-full md:w-2/3 flex flex-col">
                        <div class="flex justify-between items-center mb-3 border-b pb-2">
                            <h4 class="text-sm font-bold text-gray-800">Saved Suppliers (List View)</h4>
                            <span class="text-xs text-gray-500 font-medium">Reorder columns in main table headers</span>
                        </div>
                        <div id="supplierListContainer" class="space-y-2 overflow-y-auto pr-2 pb-4 h-full max-h-[400px]">
                            <!-- Injected -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="productModal" class="fixed inset-0 z-[60] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
            <div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity" onclick="window.closeProductModal()"></div>
            <div class="relative bg-white rounded-xl text-left shadow-2xl transform transition-all sm:my-8 sm:max-w-2xl w-full flex flex-col">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-xl">
                    <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2" id="prodModalTitle">
                        <i class="ph-fill ph-package text-brandBlue text-xl"></i> Add Product
                    </h3>
                    <button type="button" onclick="window.closeProductModal()" class="text-gray-400 hover:text-gray-800"><i class="ph ph-x text-xl"></i></button>
                </div>
                <div class="p-6 bg-white space-y-5">
                    <input type="hidden" id="editingProductId" value="">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Product Name *</label>
                            <input type="text" id="prodName" class="w-full border border-gray-300 rounded-lg py-2 px-3 text-sm focus:ring-2 focus:ring-brandBlue outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Carton Size *</label>
                            <input type="text" id="prodSize" placeholder="e.g. 24 Pcs/Crtn" class="w-full border border-gray-300 rounded-lg py-2 px-3 text-sm focus:ring-2 focus:ring-brandBlue outline-none shadow-sm">
                        </div>
                    </div>
                    <div class="border-t border-gray-100 pt-4">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Product Images (Up to 5)</label>
                        <p class="text-xs text-brandOrange mb-3 font-medium">Images are automatically compressed to save space.</p>
                        <div class="grid grid-cols-5 gap-2 sm:gap-4" id="imageUploadContainer"></div>
                        <div id="existingImagesContainer" class="hidden"></div>
                    </div>
                </div>
                <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3 rounded-b-xl border-t border-gray-200">
                    <button type="button" onclick="window.closeProductModal()" class="px-5 py-2 border border-gray-300 bg-white text-sm font-bold text-gray-700 rounded-lg hover:bg-gray-100 shadow-sm">Cancel</button>
                    <button type="button" onclick="window.saveProduct()" class="px-5 py-2 bg-brandBlue text-white text-sm font-bold rounded-lg hover:bg-brandBlueDark shadow-md">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <div id="customAlert" class="fixed inset-0 z-[300] hidden overflow-y-auto flex items-center justify-center">
        <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity"></div>
        <div class="bg-white rounded-xl shadow-2xl transform transition-all w-full max-w-sm mx-4 relative z-10 overflow-hidden">
            <div class="p-6 text-center">
                <div id="alertIcon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4"></div>
                <h3 class="text-lg font-bold text-gray-900 mb-2" id="alertTitle">Alert</h3>
                <p class="text-sm text-gray-500" id="alertMessage"></p>
            </div>
            <div class="bg-gray-50 px-4 py-3 flex justify-center gap-3 border-t border-gray-100" id="alertActions"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Required Config
        const firebaseConfig = {
            apiKey: "AIzaSyDdJyENlXcr0LG8hKwbAkG3y8eRe0TXP4E",
            authDomain: "indiglob-indiamart.firebaseapp.com",
            databaseURL: "https://indiglob-indiamart-default-rtdb.firebaseio.com",
            projectId: "indiglob-indiamart",
            storageBucket: "indiglob-indiamart.firebasestorage.app",
            messagingSenderId: "270808193556",
            appId: "1:270808193556:web:d71c120e36ecbaa3582501"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global State Binding
        window.products = [];
        window.suppliers = [];
        window.filteredProducts = [];
        window.currentConfirmAction = null;
        
        // Drag & Drop / Resize State
        window.draggedSupId = null;
        window.isResizing = false;
        window.resizingColId = null;
        window.resizeStartX = 0;
        window.resizeStartWidth = 0;

        // --- Core Data Sync ---
        window.loadData = async function() {
            const status = document.getElementById('syncStatus');
            try {
                // Must keep path 'indiglobData' to preserve user's data
                const snapshot = await get(child(ref(db), `indiglobData`)); 
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    window.products = data.products || [];
                    window.suppliers = data.suppliers || [];
                } else {
                    window.products = [];
                    window.suppliers = [];
                }
                
                window.products.reverse(); 
                window.filteredProducts = [...window.products];
                window.renderTable();
                
                status.innerHTML = `<i class="ph-fill ph-check-circle text-green-600"></i> Data synced`;
                status.className = "text-sm font-bold px-3 py-1.5 rounded-lg border flex items-center gap-2 bg-green-50 text-green-700 border-green-200";
            } catch (error) {
                console.error("DB Error:", error);
                status.innerHTML = `<i class="ph-fill ph-warning-circle text-red-600"></i> Sync failed`;
                status.className = "text-sm font-bold px-3 py-1.5 rounded-lg border flex items-center gap-2 bg-red-50 text-red-700 border-red-200";
                window.showAlert("Error", "Could not connect to Firebase database.", "error");
            }
        };

        window.saveData = function(silent = false) {
            const status = document.getElementById('syncStatus');
            if(!silent) {
                status.innerHTML = `<i class="ph ph-spinner animate-spin"></i> Saving...`;
                status.className = "text-sm font-semibold px-3 py-1.5 rounded-lg border flex items-center gap-2 bg-blue-50 text-brandBlue border-blue-100";
            }
            
            const dataToSave = [...window.products].reverse();
            
            set(ref(db, 'indiglobData'), { 
                products: dataToSave,
                suppliers: window.suppliers
            }).then(() => {
                if(!silent) {
                    status.innerHTML = `<i class="ph-fill ph-check-circle text-green-600"></i> Saved`;
                    status.className = "text-sm font-bold px-3 py-1.5 rounded-lg border flex items-center gap-2 bg-green-50 text-green-700 border-green-200";
                }
            }).catch(error => {
                console.error("Save Error:", error);
                window.showAlert("Error", "Failed to save data. Check connection.", "error");
            });
        };

        // --- Event Listeners for Column Resizing ---
        document.addEventListener('mousemove', (e) => {
            if (!window.isResizing || !window.resizingColId) return;
            const width = Math.max(100, window.resizeStartWidth + (e.pageX - window.resizeStartX)); // min width 100
            const th = document.getElementById(window.resizingColId);
            if (th) {
                th.style.width = width + 'px';
                th.style.minWidth = width + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (window.isResizing) {
                const th = document.getElementById(window.resizingColId);
                if (th) {
                    const supId = th.dataset.supid;
                    const idx = window.suppliers.findIndex(s => s.id === supId);
                    if(idx > -1) {
                        window.suppliers[idx].colWidth = th.style.width;
                        window.saveData(true); // silent save
                    }
                }
                window.isResizing = false;
                window.resizingColId = null;
                document.body.style.cursor = 'default';
            }
        });

        window.initResize = function(e, colId) {
            e.stopPropagation();
            window.isResizing = true;
            window.resizingColId = colId;
            window.resizeStartX = e.pageX;
            const th = document.getElementById(colId);
            window.resizeStartWidth = th.offsetWidth;
            document.body.style.cursor = 'col-resize';
        };

        // --- Drag and Drop Suppliers (Column Organizer) ---
        window.handleDragStart = function(e, supId) {
            window.draggedSupId = supId;
            e.dataTransfer.effectAllowed = 'move';
            e.target.classList.add('opacity-40', 'border-dashed', 'border-2', 'border-brandOrange');
        };

        window.handleDragOver = function(e) {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('bg-blue-100');
        };

        window.handleDragLeave = function(e) {
             e.currentTarget.classList.remove('bg-blue-100');
        };

        window.handleDrop = function(e, targetSupId) {
            e.preventDefault();
            e.currentTarget.classList.remove('bg-blue-100');
            
            if (!window.draggedSupId || window.draggedSupId === targetSupId) return;

            const fromIdx = window.suppliers.findIndex(s => s.id === window.draggedSupId);
            const toIdx = window.suppliers.findIndex(s => s.id === targetSupId);

            if (fromIdx > -1 && toIdx > -1) {
                const [moved] = window.suppliers.splice(fromIdx, 1);
                window.suppliers.splice(toIdx, 0, moved);
                window.saveData();
                window.renderTable();
            }
        };

        window.handleDragEnd = function(e) {
            e.target.classList.remove('opacity-40', 'border-dashed', 'border-2', 'border-brandOrange');
            window.draggedSupId = null;
        };

        // --- Image Lightbox ---
        window.openLightbox = function(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('imageLightbox').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        };

        window.closeLightbox = function() {
            document.getElementById('imageLightbox').classList.add('hidden');
            document.body.style.overflow = '';
        };

        // --- STREAMING_CHUNK: Table Rendering ---
        window.renderTable = function() {
            const thead = document.getElementById('tableHeaderRow');
            const tbody = document.getElementById('tableBody');
            
            // Fixed First Row Headers
            let hHTML = `
                <th class="sticky-col-1 px-4 py-3 text-left font-bold text-gray-700 bg-[#f8fafc] border-b-2 border-gray-200 border-r border-gray-100 header-shadow">Image</th>
                <th class="sticky-col-2 px-4 py-3 text-left font-bold text-gray-700 bg-[#f8fafc] border-b-2 border-gray-200 border-r border-gray-100 header-shadow">Product Detail</th>
                <th class="sticky-col-3 px-4 py-3 text-left font-bold text-gray-700 bg-[#f8fafc] border-b-2 border-gray-200 sticky-shadow header-shadow border-r border-gray-300">Crtn Size</th>
            `;
            
            // Draggable Supplier Columns
            window.suppliers.forEach(sup => {
                const display = sup.nickName || sup.companyName;
                const widthStyle = sup.colWidth ? `width: ${sup.colWidth}; min-width: ${sup.colWidth};` : `width: 140px; min-width: 140px;`;
                
                hHTML += `
                    <th id="th-${sup.id}" data-supid="${sup.id}" 
                        draggable="true" 
                        ondragstart="window.handleDragStart(event, '${sup.id}')"
                        ondragover="window.handleDragOver(event)"
                        ondragleave="window.handleDragLeave(event)"
                        ondrop="window.handleDrop(event, '${sup.id}')"
                        ondragend="window.handleDragEnd(event)"
                        class="px-4 py-2 text-left border-r border-gray-200 bg-[#eff6ff] border-b-2 border-brandBlue/30 relative cursor-grab active:cursor-grabbing hover:bg-blue-100 transition-colors header-shadow group"
                        style="${widthStyle}">
                        <div class="text-sm font-bold text-brandBlue truncate pointer-events-none" title="${sup.companyName}">${window.escapeHtml(display)}</div>
                        <div class="text-[10px] font-bold text-gray-500 uppercase pointer-events-none">Rate (₹)</div>
                        
                        <!-- Drag Icon Indicator -->
                        <div class="absolute left-1 top-1/2 transform -translate-y-1/2 opacity-0 group-hover:opacity-30 pointer-events-none">
                            <i class="ph-bold ph-dots-six-vertical text-brandBlue"></i>
                        </div>
                        
                        <!-- Resize Handle -->
                        <div class="absolute right-0 top-0 bottom-0 w-[6px] cursor-col-resize hover:bg-brandOrange/80 z-50 transition-colors" 
                             onmousedown="window.initResize(event, 'th-${sup.id}')" title="Resize Column"></div>
                    </th>`;
            });
            hHTML += `<th class="px-4 py-3 text-center font-bold text-gray-700 w-20 bg-[#f8fafc] border-b-2 border-gray-200 header-shadow">Action</th>`;
            thead.innerHTML = hHTML;

            // Render Body
            if (window.filteredProducts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${4 + window.suppliers.length}" class="py-20 text-center text-gray-400 font-medium">No products match your search.</td></tr>`;
                return;
            }

            let bHTML = '';
            window.filteredProducts.forEach(prod => {
                const img = (prod.images && prod.images.length > 0) ? prod.images[0] : 'https://placehold.co/100x100/f8fafc/94a3b8?text=No+Img';
                
                bHTML += `
                    <tr class="hover:bg-orange-50/40 group transition-colors">
                        <td class="sticky-col-1 px-4 py-3 bg-white group-hover:bg-[#fff9f5] border-r border-gray-100">
                            <img src="${img}" class="h-12 w-12 rounded object-cover border border-gray-200 cursor-pointer shadow-sm hover:shadow-md transition-shadow" 
                                 onclick="window.openLightbox('${img}')" title="Click to view full image">
                        </td>
                        <td class="sticky-col-2 px-4 py-3 bg-white group-hover:bg-[#fff9f5] border-r border-gray-100">
                            <div class="font-bold text-brandBlue cursor-pointer hover:text-brandOrange transition-colors text-[15px] truncate" title="Edit Product" onclick="window.editProduct('${prod.id}')">${window.escapeHtml(prod.name)}</div>
                            <div class="text-[11px] text-gray-400 font-semibold mt-0.5">${prod.images?.length || 0} IMAGE(S)</div>
                        </td>
                        
                        <!-- Editable Crtn Size Column -->
                        <td class="sticky-col-3 px-4 py-3 font-bold text-gray-800 bg-white group-hover:bg-[#fff9f5] sticky-shadow border-r border-gray-300 cursor-pointer hover:text-brandOrange transition-colors"
                            onclick="window.startInlineEditCrtn(event, '${prod.id}', '${window.escapeHtml(prod.crtnSize)}')">
                            <div id="crtn-cell-${prod.id}" class="min-h-[36px] flex items-center truncate" title="Click to edit size">
                                ${window.escapeHtml(prod.crtnSize)}
                            </div>
                        </td>
                `;

                window.suppliers.forEach(sup => {
                    const rData = prod.supplierRates ? prod.supplierRates[sup.id] : null;
                    const rVal = rData && rData.rate ? rData.rate : '';
                    const rDate = rData && rData.date ? rData.date : '';
                    
                    bHTML += `
                        <td class="px-4 py-2 border-r border-gray-100 relative group/cell cursor-pointer hover:bg-blue-50/50" 
                            onclick="window.startInlineEdit(event, '${prod.id}', '${sup.id}', '${rVal}')">
                            <div class="flex flex-col min-h-[36px] justify-center" id="cell-${prod.id}-${sup.id}">
                                ${rVal ? `<div class="font-bold text-gray-900 text-[15px]">₹ ${parseFloat(rVal).toLocaleString('en-IN')}</div>
                                          <div class="text-[9px] text-brandOrange font-bold uppercase mt-0.5">${rDate}</div>` 
                                       : `<span class="text-gray-300 text-xs font-semibold italic group-hover/cell:text-brandBlue/50 transition-colors">Set price</span>`}
                            </div>
                        </td>`;
                });

                bHTML += `
                        <td class="px-4 py-3 text-center bg-white group-hover:bg-[#fff9f5]">
                            <button onclick="window.deleteProduct('${prod.id}')" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                                <i class="ph-fill ph-trash text-lg"></i>
                            </button>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = bHTML;
        };

        // --- Inline Edits (Crtn Size & Rates) ---
        window.startInlineEditCrtn = function(e, prodId, currentVal) {
            const td = e.currentTarget;
            const contentDiv = document.getElementById(`crtn-cell-${prodId}`);
            if(contentDiv.querySelector('input')) return;
            
            contentDiv.innerHTML = `
                <input type="text" value="${currentVal}" 
                       class="w-full px-2 py-1 text-sm border-2 border-brandOrange rounded shadow-inner outline-none font-bold text-gray-900 bg-white"
                       onblur="window.saveInlineEditCrtn(this, '${prodId}')"
                       onkeydown="if(event.key==='Enter') this.blur(); if(event.key==='Escape') window.renderTable();">
            `;
            const input = contentDiv.querySelector('input');
            input.focus();
            input.select();
        };

        window.saveInlineEditCrtn = function(inputEl, prodId) {
            const val = inputEl.value.trim();
            const pIdx = window.products.findIndex(p => p.id === prodId);
            
            if (pIdx > -1 && val) {
                window.products[pIdx].crtnSize = val;
                const fIdx = window.filteredProducts.findIndex(p => p.id === prodId);
                if(fIdx > -1) window.filteredProducts[fIdx] = window.products[pIdx];
                window.saveData(true); // silent save
            }
            window.renderTable();
        };

        window.startInlineEdit = function(e, prodId, supId, currentVal) {
            const td = e.currentTarget;
            const contentDiv = document.getElementById(`cell-${prodId}-${supId}`);
            if(contentDiv.querySelector('input')) return;
            
            contentDiv.innerHTML = `
                <div class="flex items-center gap-1">
                    <span class="text-brandBlue font-bold text-sm">₹</span>
                    <input type="number" step="0.01" value="${currentVal}" 
                           class="w-[80px] px-1 py-1 text-sm border-2 border-brandBlue rounded shadow-inner outline-none font-bold text-gray-900 bg-white"
                           onblur="window.saveInlineEdit(this, '${prodId}', '${supId}')"
                           onkeydown="if(event.key==='Enter') this.blur(); if(event.key==='Escape') window.renderTable();">
                </div>
            `;
            const input = contentDiv.querySelector('input');
            input.focus();
            input.select();
        };

        window.saveInlineEdit = function(inputEl, prodId, supId) {
            const val = inputEl.value.trim();
            const pIdx = window.products.findIndex(p => p.id === prodId);
            
            if (pIdx > -1) {
                if (!window.products[pIdx].supplierRates) window.products[pIdx].supplierRates = {};
                
                if (val !== '' && parseFloat(val) >= 0) {
                    const d = new Date();
                    const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear().toString().slice(-2)}`;
                    window.products[pIdx].supplierRates[supId] = { rate: parseFloat(val).toString(), date: dateStr };
                } else {
                    delete window.products[pIdx].supplierRates[supId];
                }
                
                const fIdx = window.filteredProducts.findIndex(p => p.id === prodId);
                if(fIdx > -1) window.filteredProducts[fIdx] = window.products[pIdx];
                window.saveData(true); // silent save
            }
            window.renderTable();
        };

        // --- Basic Features (Search, Products, Alerts) ---
        window.handleSearch = function() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const terms = val.split(' ').filter(t => t.trim() !== '');
            window.filteredProducts = window.products.filter(p => {
                const name = p.name.toLowerCase();
                return terms.every(term => name.includes(term));
            });
            window.renderTable();
        };

        window.showAlert = function(title, message, type = 'info', callback = null) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const icon = document.getElementById('alertIcon');
            const actions = document.getElementById('alertActions');
            if (type === 'error') {
                icon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-red-100 text-red-600 text-2xl';
                icon.innerHTML = '<i class="ph-fill ph-warning"></i>';
                actions.innerHTML = `<button onclick="window.closeAlert()" class="px-5 py-2 bg-red-600 text-white rounded-lg font-bold">Close</button>`;
            } else if (type === 'confirm') {
                icon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-orange-100 text-brandOrange text-2xl';
                icon.innerHTML = '<i class="ph-fill ph-question"></i>';
                window.currentConfirmAction = callback;
                actions.innerHTML = `
                    <button onclick="window.closeAlert()" class="px-5 py-2 border border-gray-300 text-gray-700 bg-white rounded-lg font-bold shadow-sm">Cancel</button>
                    <button onclick="window.executeConfirm()" class="px-5 py-2 bg-brandOrange text-white rounded-lg font-bold shadow-md">Confirm</button>
                `;
            } else {
                icon.className = 'mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-blue-100 text-brandBlue text-2xl';
                icon.innerHTML = '<i class="ph-fill ph-info"></i>';
                actions.innerHTML = `<button onclick="window.closeAlert()" class="px-5 py-2 bg-brandBlue text-white rounded-lg font-bold shadow-sm">OK</button>`;
            }
            document.getElementById('customAlert').classList.remove('hidden');
        };

        window.closeAlert = function() {
            document.getElementById('customAlert').classList.add('hidden');
            window.currentConfirmAction = null;
        };

        window.executeConfirm = function() {
            if (typeof window.currentConfirmAction === 'function') window.currentConfirmAction();
            window.closeAlert();
        };

        // --- Product Add/Edit ---
        window.openProductModal = function() {
            document.getElementById('editingProductId').value = '';
            document.getElementById('prodName').value = '';
            document.getElementById('prodSize').value = '';
            document.getElementById('prodModalTitle').innerHTML = '<i class="ph-fill ph-package text-brandBlue text-xl"></i> Add Product';
            window.buildImageInputs([]);
            document.getElementById('productModal').classList.remove('hidden');
        };

        window.closeProductModal = function() { document.getElementById('productModal').classList.add('hidden'); };

        window.saveProduct = function() {
            const name = document.getElementById('prodName').value.trim();
            const size = document.getElementById('prodSize').value.trim();
            const editId = document.getElementById('editingProductId').value;
            
            if (!name || !size) {
                window.showAlert("Required Fields", "Please enter both Product Name and Carton Size.", "info");
                return;
            }

            const images = [];
            for (let i = 1; i <= 5; i++) {
                const imgInput = document.getElementById(`prodImg${i}`);
                const hiddenInput = document.getElementById(`storedImg${i}`);
                if (imgInput && imgInput.dataset.base64) images.push(imgInput.dataset.base64);
                else if (hiddenInput && hiddenInput.value) images.push(hiddenInput.value);
            }

            if (editId) {
                const idx = window.products.findIndex(p => p.id === editId);
                if (idx > -1) {
                    window.products[idx].name = name;
                    window.products[idx].crtnSize = size;
                    window.products[idx].images = images;
                }
            } else {
                window.products.unshift({
                    id: 'prod_' + Date.now(),
                    name: name,
                    crtnSize: size,
                    images: images,
                    supplierRates: {}
                });
            }
            window.handleSearch(); 
            window.saveData();
            window.closeProductModal();
        };

        window.editProduct = function(id) {
            const p = window.products.find(x => x.id === id);
            if(!p) return;
            document.getElementById('editingProductId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodSize').value = p.crtnSize;
            document.getElementById('prodModalTitle').innerHTML = '<i class="ph-fill ph-pencil-simple text-brandOrange text-xl"></i> Edit Product';
            window.buildImageInputs(p.images || []);
            document.getElementById('productModal').classList.remove('hidden');
        };

        window.deleteProduct = function(id) {
            window.showAlert("Delete Product", "Are you sure you want to delete this product forever?", "confirm", () => {
                window.products = window.products.filter(p => p.id !== id);
                window.handleSearch();
                window.saveData();
            });
        };

        window.previewImage = function(input, previewId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX = 600; 
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } 
                        else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        
                        const pDiv = document.getElementById(previewId);
                        pDiv.style.backgroundImage = `url(${dataUrl})`;
                        pDiv.classList.remove('hidden');
                        input.dataset.base64 = dataUrl;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.buildImageInputs = function(existing) {
            const c = document.getElementById('imageUploadContainer');
            const h = document.getElementById('existingImagesContainer');
            c.innerHTML = ''; h.innerHTML = '';
            existing.forEach((img, i) => { h.innerHTML += `<input type="hidden" id="storedImg${i+1}" value="${window.escapeHtml(img)}">`; });

            for (let i = 1; i <= 5; i++) {
                const imgData = existing[i-1] || '';
                const style = imgData ? `background-image: url(${imgData});` : '';
                const hideClass = imgData ? '' : 'hidden';
                c.innerHTML += `
                    <div class="relative group border-2 border-dashed border-gray-300 rounded-lg h-20 sm:h-24 flex flex-col items-center justify-center cursor-pointer hover:border-brandBlue overflow-hidden bg-gray-50 transition-colors">
                        <input type="file" id="prodImg${i}" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="window.previewImage(this, 'previewImg${i}')">
                        <div class="flex flex-col items-center z-10 pointer-events-none">
                            <i class="ph ph-image text-gray-400 text-xl group-hover:text-brandBlue"></i>
                            <span class="text-[10px] font-bold text-gray-400 group-hover:text-brandBlue mt-1">Img ${i}</span>
                        </div>
                        <div id="previewImg${i}" class="absolute inset-0 bg-cover bg-center bg-white z-[15] ${hideClass}" style="${style}">
                            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-bold z-10">Replace</div>
                        </div>
                    </div>
                `;
            }
        };

        // --- Supplier Management ---
        window.openSupplierManager = function() {
            window.resetSupplierForm();
            window.renderSupplierList();
            document.getElementById('supplierModal').classList.remove('hidden');
        };
        window.closeSupplierManager = function() { document.getElementById('supplierModal').classList.add('hidden'); };
        window.resetSupplierForm = function() {
            document.getElementById('supId').value = '';
            document.getElementById('supName').value = '';
            document.getElementById('supCompany').value = '';
            document.getElementById('supNick').value = '';
            document.getElementById('supContact').value = '';
            document.getElementById('supAddress').value = '';
            document.getElementById('supFormTitle').innerText = 'Add New Supplier';
        };

        window.saveSupplier = function() {
            const id = document.getElementById('supId').value;
            const name = document.getElementById('supName').value.trim();
            const comp = document.getElementById('supCompany').value.trim();
            if (!name || !comp) { window.showAlert("Required", "Company Name and Supplier Name are mandatory.", "info"); return; }

            const data = {
                id: id || 'sup_' + Date.now(),
                name: name,
                companyName: comp,
                nickName: document.getElementById('supNick').value.trim(),
                contact: document.getElementById('supContact').value.trim(),
                address: document.getElementById('supAddress').value.trim(),
                colWidth: '140px'
            };

            if (id) {
                const idx = window.suppliers.findIndex(s => s.id === id);
                if(idx > -1) {
                    data.colWidth = window.suppliers[idx].colWidth || '140px'; // Preserve width
                    window.suppliers[idx] = data;
                }
            } else {
                window.suppliers.push(data);
            }
            window.saveData();
            window.resetSupplierForm();
            window.renderSupplierList();
            window.renderTable();
        };

        window.editSupplier = function(id) {
            const s = window.suppliers.find(x => x.id === id);
            if(!s) return;
            document.getElementById('supId').value = s.id;
            document.getElementById('supName').value = s.name;
            document.getElementById('supCompany').value = s.companyName;
            document.getElementById('supNick').value = s.nickName || '';
            document.getElementById('supContact').value = s.contact || '';
            document.getElementById('supAddress').value = s.address || '';
            document.getElementById('supFormTitle').innerText = 'Edit Supplier';
        };

        window.deleteSupplier = function(id) {
            window.showAlert("Delete Supplier", "Remove this supplier? Price columns will be deleted from all products.", "confirm", () => {
                window.suppliers = window.suppliers.filter(s => s.id !== id);
                window.products.forEach(p => { if(p.supplierRates && p.supplierRates[id]) delete p.supplierRates[id]; });
                window.saveData();
                window.renderSupplierList();
                window.renderTable();
            });
        };

        window.renderSupplierList = function() {
            const c = document.getElementById('supplierListContainer');
            if (window.suppliers.length === 0) {
                c.innerHTML = '<div class="text-sm text-gray-400 italic text-center py-4">No suppliers added yet.</div>';
                return;
            }
            let html = '';
            window.suppliers.forEach(s => {
                html += `
                    <div class="border border-gray-200 rounded-lg p-3 hover:border-brandOrange hover:bg-orange-50/20 transition-colors flex justify-between items-center group bg-white shadow-sm">
                        <div class="overflow-hidden flex-grow">
                            <div class="font-bold text-gray-800 text-sm truncate">${window.escapeHtml(s.companyName)}</div>
                            <div class="text-xs text-gray-500 font-medium">${window.escapeHtml(s.name)} ${s.nickName ? `• <span class="text-brandBlue">${window.escapeHtml(s.nickName)}</span>` : ''}</div>
                        </div>
                        <div class="flex items-center gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="window.editSupplier('${s.id}')" class="p-1.5 text-blue-500 hover:bg-blue-100 rounded" title="Edit"><i class="ph-fill ph-pencil-simple text-lg"></i></button>
                            <button onclick="window.deleteSupplier('${s.id}')" class="p-1.5 text-red-500 hover:bg-red-100 rounded" title="Delete"><i class="ph-fill ph-trash text-lg"></i></button>
                        </div>
                    </div>
                `;
            });
            c.innerHTML = html;
        };

        // --- Utility ---
        window.escapeHtml = function(s) {
            return (s || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        window.exportToCSV = function() {
            if(window.filteredProducts.length === 0) return;
            let csv = "Product Name,Carton Size,";
            window.suppliers.forEach(s => {
                csv += `"${(s.nickName || s.companyName).replace(/"/g, '""')} Rate",`;
                csv += `"${(s.nickName || s.companyName).replace(/"/g, '""')} Date Updated",`;
            });
            csv += "\r\n";
            window.filteredProducts.forEach(p => {
                csv += `"${p.name.replace(/"/g, '""')}","${p.crtnSize.replace(/"/g, '""')}",`;
                window.suppliers.forEach(s => {
                    const r = p.supplierRates ? p.supplierRates[s.id] : null;
                    csv += `"${r && r.rate ? r.rate : ''}","${r && r.date ? r.date : ''}",`;
                });
                csv += "\r\n";
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI("data:text/csv;charset=utf-8," + csv));
            link.setAttribute("download", `Indiamart_Export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Start App
        window.loadData();
    </script>
</body>
</html>
